if(x<XL+0.3||x>XR-0.3||z<-10.3||z>30.2)return true;
var y0=feet+0.5,y1=feet+1.7,r=0.28;
for(var i=0;i<COL.length;i++){var c=COL[i];if(c.gate&&gateTarget>0.5)continue;if(y1<=c.y0||y0>=c.y1)continue;if(x+r>c.x0&&x-r<c.x1&&z+r>c.z0&&z-r<c.z1)return true;}
return false;
}
function groundAt(x,z,feet){var best=0;for(var i=0;i<FL.length;i++){var f=FL[i];if(x>=f.x0&&x<=f.x1&&z>=f.z0&&z<=f.z1&&f.top<=feet+0.46&&f.top>best)best=f.top;}return best;}
function walkStep(dt){
var f=((keys.w||keys.up||holds.f)?1:0)-((keys.s||keys.down||holds.b)?1:0),s=((keys.d||holds.r)?1:0)-((keys.a||holds.l)?1:0),tr=((keys.left||holds.tl)?1:0)-((keys.right||holds.tr)?1:0);
PL.yaw+=tr*1.6*dt;
var sp=2.4*dt,fx=-Math.sin(PL.yaw),fz=-Math.cos(PL.yaw),rx=Math.cos(PL.yaw),rz=-Math.sin(PL.yaw);
var dx=(fx*f+rx*s)*sp,dz=(fz*f+rz*s)*sp;
if(dx!==0&&!blocked(PL.x+dx,PL.z,PL.feet))PL.x+=dx;
if(dz!==0&&!blocked(PL.x,PL.z+dz,PL.feet))PL.z+=dz;
var gy=groundAt(PL.x,PL.z,PL.feet);
PL.feet+=(gy-PL.feet)*Math.min(1,dt*10);
camera.position.set(PL.x,PL.feet+1.62,PL.z);
var cp=Math.cos(PL.pitch);
camera.lookAt(PL.x+fx*cp,PL.feet+1.62+Math.sin(PL.pitch),PL.z+fz*cp);
}
function setWalk(on){
walkMode=on;document.getElementById('pad').style.display=on?'flex':'none';
camera.fov=on?68:35;camera.near=on?0.1:0.3;camera.updateProjectionMatrix();
if(on){auto=false;document.getElementById('cR').checked=false;gateTarget=1;document.getElementById('cG').checked=true;cvEl.focus();}
}
function tele(x,z,yaw,feet){PL.x=x;PL.z=z;PL.yaw=yaw;PL.pitch=0;PL.feet=feet;setWalk(true);}

function loop(){requestAnimationFrame(loop);
var now=performance.now(),dt=Math.min((now-last)/1000,0.05);last=now;
gateT+=(gateTarget-gateT)*Math.min(1,dt*3);leafL.rotation.y=gateT*(Math.PI/2);leafR.rotation.y=Math.PI-gateT*(Math.PI/2);
if(vm.visible&&st.visible){movers.forEach(function(m){var p=m.o.position;p.x+=m.v*dt;if(m.v>0&&p.x>XR+4)p.x=XL-4;if(m.v<0&&p.x<XL-4)p.x=XR+4;});}
if(walkMode){walkStep(dt);}
else{
S0.t.lerp(G0.t,0.12);
if(!drag){
if(auto){S0.th+=0.004;G0.th=S0.th;}else{var d=((G0.th-S0.th+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;S0.th+=d*0.12;}
S0.ph+=(G0.ph-S0.ph)*0.12;S0.r+=(G0.r-S0.r)*0.12;}
upd();}
renderer.render(scene,camera);}
loop();

var ptrs=new Map(),pd=0;
cvEl.addEventListener('pointerdown',function(e){cvEl.focus();cvEl.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});drag=true;cvEl.style.cursor='grabbing';if(ptrs.size===2){var a=Array.from(ptrs.values());pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}});
cvEl.addEventListener('pointermove',function(e){var p=ptrs.get(e.pointerId);if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
if(walkMode){PL.yaw-=dx*0.005;PL.pitch=clamp(PL.pitch-dy*0.004,-1.2,1.2);return;}
if(ptrs.size===1){S0.th-=dx*0.008;S0.ph=clamp(S0.ph-dy*0.008,0.05,1.55);}
else if(ptrs.size===2){var a=Array.from(ptrs.values());var d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pd>0)S0.r=clamp(S0.r*pd/d,3,110);pd=d;}
G0.th=S0.th;G0.ph=S0.ph;G0.r=S0.r;});
function up(e){ptrs.delete(e.pointerId);if(!ptrs.size){drag=false;cvEl.style.cursor='grab';}}
cvEl.addEventListener('pointerup',up);cvEl.addEventListener('pointercancel',up);
cvEl.addEventListener('wheel',function(e){if(walkMode)return;e.preventDefault();G0.r=S0.r=clamp(S0.r*Math.exp(e.deltaY*0.0012),3,110);},{passive:false});
var KM={w:'w',s:'s',a:'a',d:'d',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',W:'w',S:'s',A:'a',D:'d'};
cvEl.addEventListener('keydown',function(e){var k=KM[e.key];if(k){keys[k]=true;if(walkMode)e.preventDefault();}});
cvEl.addEventListener('keyup',function(e){var k=KM[e.key];if(k)keys[k]=false;});
cvEl.addEventListener('blur',function(){keys={};});
[['pF','f'],['pB','b'],['pL','l'],['pR','r'],['pTL','tl'],['pTR','tr']].forEach(function(p){var el=document.getElementById(p[0]);
el.addEventListener('pointerdown',function(e){holds[p[1]]=true;e.preventDefault();});
['pointerup','pointerleave','pointercancel'].forEach(function(n){el.addEventListener(n,function(){holds[p[1]]=false;});});});

var DT=[0.2,5,6];
var P={L:{th:0,ph:1.52,r:5.2,t:[-1.95,1.3,9.3]},F:{th:0,ph:1.46,r:34,t:DT},A:{th:0.55,ph:1.3,r:42,t:DT},W:{th:-0.25,ph:1.2,r:62,t:DT},G:{th:-0.35,ph:1.5,r:36,t:DT},K:{th:Math.PI,ph:1.3,r:44,t:DT},T:{th:0,ph:0.06,r:60,t:DT}};
function go(k){if(walkMode)setWalk(false);var p=P[k];G0.th=p.th;G0.ph=p.ph;G0.r=p.r;G0.t.set(p.t[0],p.t[1],p.t[2]);auto=false;document.getElementById('cR').checked=false;}
['L','F','A','W','G','K','T'].forEach(function(k){document.getElementById('v'+k).onclick=function(){go(k);};});
document.getElementById('zi').onclick=function(){if(!walkMode)G0.r=clamp(G0.r*0.8,3,110);};
document.getElementById('zo').onclick=function(){if(!walkMode)G0.r=clamp(G0.r*1.25,3,110);};
document.getElementById('wO').onclick=function(){tele(0.4,12,0,0.15);};
document.getElementById('wL').onclick=function(){tele(1.5,1.7,0,F0);};
document.getElementById('wF').onclick=function(){tele(0,2.0,0,F1);};
document.getElementById('wS').onclick=function(){tele(0,1.0,0,F2);};
document.getElementById('wX').onclick=function(){setWalk(false);};
document.getElementById('cN').onchange=function(e){nb.visible=e.target.checked;};
document.getElementById('cS').onchange=function(e){st.visible=e.target.checked;};
document.getElementById('cV').onchange=function(e){vm.visible=e.target.checked;};
document.getElementById('cG').onchange=function(e){gateTarget=e.target.checked?1:0;};
document.getElementById('cM').onchange=function(e){roofG.visible=!e.target.checked;};
document.getElementById('cR').onchange=function(e){auto=e.target.checked;};
})();
</script>
